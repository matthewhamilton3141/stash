<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>
  </defs>

  <!-- white squircle on the macOS icon grid (824/1024 with transparent padding) -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="none" stroke="#e5e9f0" stroke-width="2"/>

  <!-- paper: white, a touch darker than the background so it reads as a card -->
  <path d="M342 286 L618 286 L722 390 L722 716
           A40 40 0 0 1 682 756 L342 756
           A40 40 0 0 1 302 716 L302 326
           A40 40 0 0 1 342 286 Z"
        fill="#e9edf3" stroke="#d7dde7" stroke-width="2"/>
  <!-- folded corner -->
  <path d="M618 286 L722 390 L618 390 Z" fill="#cfd6e2"/>

  <!-- syntax-highlighted code lines (deeper tones for contrast on light paper) -->
  <g stroke-linecap="round" stroke-width="26">
    <line x1="358" y1="470" x2="556" y2="470" stroke="#2f81f7"/>
    <line x1="402" y1="540" x2="648" y2="540" stroke="#2ea043"/>
    <line x1="402" y1="610" x2="566" y2="610" stroke="#bf8700"/>
    <line x1="358" y1="680" x2="528" y2="680" stroke="#8250df"/>
  </g>
</svg>
