<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fdf8f0"/>
      <stop offset="1" stop-color="#f2e7d6"/>
    </linearGradient>
    <linearGradient id="keySide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c05a20"/>
      <stop offset="1" stop-color="#8e3d13"/>
    </linearGradient>
    <linearGradient id="keyTop" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#ffb168"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff6a34"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="cast" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7a4a22" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- cream squircle: the light-theme twin of app-icon.svg.
       hairline edge so it still has a shape on white -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="183.5" fill="none" stroke="#e7d8c4" stroke-width="3"/>

  <!-- the shortcut, made physical: the key you press to stash -->
  <g filter="url(#cast)">
    <rect x="272" y="286" width="480" height="468" rx="110" fill="url(#keySide)"/>
    <rect x="306" y="302" width="412" height="392" rx="84" fill="url(#keyTop)"/>
    <rect x="306" y="302" width="412" height="392" rx="84" fill="url(#gloss)"/>
  </g>

  <!-- S, centered on the key face -->
  <g transform="translate(402 362) scale(1.08)" fill="none" stroke="#1b140e" stroke-width="42"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M162 46 C140 26 96 20 70 38 C40 58 42 100 76 116 L124 138
             C162 156 164 202 132 220 C104 236 62 232 40 212"/>
  </g>
</svg>
